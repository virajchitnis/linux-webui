name: CI

on:
  push:
    branches:
      - claude/modernize-server-console-Jg45U
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  build:
    name: Production binary
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Build binary
        run: >
          go build
          -tags production
          -ldflags "-X main.version=ci-${{ github.sha }}"
          -o linux-webui
          ./cmd/linux-webui

      - uses: actions/upload-artifact@v4
        with:
          name: linux-webui-${{ github.sha }}
          path: linux-webui
          retention-days: 7

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Build binary
        run: >
          go build
          -tags production
          -ldflags "-X main.version=e2e"
          -o linux-webui
          ./cmd/linux-webui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install e2e deps
        run: npm ci
        working-directory: e2e

      - name: Start server
        run: |
          mkdir -p /tmp/lwui-e2e/tls
          cat > /tmp/lwui-e2e/config.toml <<'TOML'
          [server]
          listen      = "127.0.0.1:8443"
          tls_cert    = "/tmp/lwui-e2e/tls/cert.pem"
          tls_key     = "/tmp/lwui-e2e/tls/key.pem"
          http_listen = ""

          [auth]
          bcrypt_cost = 4

          [features]
          terminal_enabled = false

          [ollama]
          enabled = false
          TOML
          cd /tmp/lwui-e2e && $GITHUB_WORKSPACE/linux-webui --config /tmp/lwui-e2e/config.toml &
          echo $! > /tmp/lwui-e2e/server.pid
          for i in $(seq 1 30); do
            curl -sk https://127.0.0.1:8443/health > /dev/null && echo "Server ready" && break
            sleep 1
          done

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/lwui-e2e/server.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
